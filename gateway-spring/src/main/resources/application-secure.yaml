server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:certs/gateway.p12
    key-store-password: changeit
    key-store-type: PKCS12
    trust-store: classpath:certs/truststore.p12
    trust-store-password: changeit
    trust-store-type: PKCS12
    client-auth: none

spring:
  application:
    name: gateway-spring

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:

            # =========================
            # HEALTH CHECK - ETUDIANTS
            # =========================

            - id: etudiants-health
              uri: https://localhost:5101
              predicates:
                - Path=/api/etudiants/health
              filters:
                - SetPath=/health

            # =========================
            # HEALTH CHECK - TRANSPORT
            # =========================

            - id: transport-health
              uri: https://localhost:5102
              predicates:
                - Path=/api/transport/health
              filters:
                - SetPath=/health

            # =========================
            # HEALTH CHECK - ACADEMIQUE
            # =========================

            - id: academique-health
              uri: https://localhost:5103
              predicates:
                - Path=/api/academique/health
              filters:
                - SetPath=/health

            # =========================
            # HEALTH CHECK - FINANCE
            # =========================

            - id: finance-health
              uri: https://localhost:5104
              predicates:
                - Path=/api/finance/health
              filters:
                - SetPath=/health

            # =========================
            # ETUDIANTS
            # =========================

            - id: etudiants
              uri: https://localhost:5101
              predicates:
                - Path=/api/etudiants/**
              filters:
                
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

            # =========================
            # TRANSPORT
            # =========================

            - id: transport
              uri: https://localhost:5102
              predicates:
                - Path=/api/transport/**
              filters:
                
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

            # =========================
            # ACADEMIQUE
            # =========================

            - id: academique
              uri: https://localhost:5103
              predicates:
                - Path=/api/academique/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

            # =========================
            # FINANCE
            # =========================

            - id: finance
              uri: https://localhost:5104
              predicates:
                - Path=/api/finance/**
              filters:
    
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

            # =========================
            # RH / PAIE - SOAP
            # =========================

            - id: rhpaie
              uri: https://localhost:5105
              predicates:
                - Path=/api/rhpaie/**
              filters:
                - StripPrefix=2

gateway:
  ssl:
    key-store: classpath:certs/gateway.p12
    key-store-password: changeit
    trust-store: classpath:certs/truststore.p12
    trust-store-password: changeit

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: read-only

logging:
  level:
    org.springframework.cloud.gateway: INFO

security:
  hmac:
    secret: ${HMAC_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  role-matrix:
    "[/api/finance/**]": [FINANCE, ADMIN]
    "[/api/etudiants/**]": [ETUDIANT, ADMIN]
    "[/api/academique/**]": [ACADEMIQUE, ADMIN]
    "[/api/transport/**]": [TRANSPORT, ADMIN]
    "[/api/rhpaie/**]": [RH, ADMIN]
